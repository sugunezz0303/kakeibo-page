<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シンプルな家計簿アプリ</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <header>
      <h1>家計簿</h1>
      <h2>家計簿をつけましょう</h2>
    </header>

    <main class="ledger-layout">
      <section class="entry-panel" aria-labelledby="entry-heading">
        <h2 id="entry-heading">家計簿に登録</h2>
        <form>
          <p>
            <label for="date">日付</label>
            <input type="date" id="date" name="date" required />
          </p>
          <p>
            <label for="item">品目</label>
            <input type="text" id="item" name="item" required />
          </p>
          <p>
            <label for="type">収支</label>
            <select id="type" name="type" required>
              <option value="expense">支出</option>
              <option value="income">収入</option>
            </select>
          </p>
          <p>
            <label for="amount">金額</label>
            <span class="amount-field">
              <input
                type="number"
                id="amount"
                name="amount"
                min="0"
                step="1"
                required
              />
              <span>円</span>
            </span>
          </p>
          <button type="submit">追加</button>
        </form>
      </section>

      <div class="overview-column">
        <section class="total-panel" aria-labelledby="total-heading">
          <h2 id="total-heading">家計簿記録の登録</h2>
          <p><output aria-label="合計金額">0</output>円</p>
        </section>

        <section class="list-panel" aria-labelledby="list-heading">
          <h2 id="list-heading">登録データ一覧</h2>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">日付</th>
                  <th scope="col">品目</th>
                  <th scope="col">種別</th>
                  <th scope="col">金額</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="4">登録データはありません</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
